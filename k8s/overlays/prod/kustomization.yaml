apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prod
resources:
  - ../../base
replicas:
  - name: myapp
    count: 3
labels:
  - pairs:
      env: prod
    includeSelectors: false
    includeTemplates: true
patches:
  - target:
      kind: ConfigMap
      name: myapp-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: prod
images:
  - name: ghcr.io/lo-riana/devops-project
    newTag: "7474b555c8c131095aa3ada93aead83bcc55d6eb"
commonAnnotations:
  git-commit: "7474b555c8c131095aa3ada93aead83bcc55d6eb"
  pipeline-run: "https://github.com/lo-riana/devops-project/actions/runs/44065763084"
  owner: "team-a"
  ticket: "OPS-123"