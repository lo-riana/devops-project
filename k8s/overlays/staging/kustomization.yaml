apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
replicas:
  - name: myapp
    count: 2
labels:
  - pairs:
      env: staging
    includeSelectors: false
    includeTemplates: true
patches:
  - target:
      kind: ConfigMap
      name: myapp-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: staging