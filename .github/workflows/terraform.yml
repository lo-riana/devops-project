name: terraform

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [envs/dev, envs/staging, preview]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive infra
      - name: Init
        run: terraform -chdir=infra/${{ matrix.dir }} init -backend=false
      - name: Validate
        run: terraform -chdir=infra/${{ matrix.dir }} validate

  plan:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - name: Init
        run: terraform -chdir=infra/envs/dev init -input=false
      - name: Plan
        run: terraform -chdir=infra/envs/dev plan -input=false -no-color -var-file=dev.tfvars | tee plan.txt
      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-dev
          path: plan.txt

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          version: v0.69.3
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: "1"